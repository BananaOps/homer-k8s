---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.1
  name: homerpages.homer.bananaops.io
spec:
  group: homer.bananaops.io
  names:
    kind: HomerPage
    listKind: HomerPageList
    plural: homerpages
    singular: homerpage
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.pageName
      name: Page
      type: string
    - jsonPath: .spec.autoLink
      name: AutoLink
      type: boolean
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          HomerPage is the Schema for the homerpages API.
          A HomerPage creates a dedicated Homer page file (<pageName>.yml) in the assets
          directory, allowing Homer to serve multiple dashboard pages.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HomerPageSpec defines the desired state of HomerPage
            properties:
              autoLink:
                default: false
                description: |-
                  AutoLink controls whether a link to this page is automatically added to the
                  main config.yml navbar links. Defaults to false.
                type: boolean
              groups:
                description: Groups is the list of service groups displayed on this page.
                items:
                  properties:
                    icon:
                      description: Icon of group in homer dashboard, See https://fontawesome.com/v5/search
                        for icons options
                      type: string
                    items:
                      description: Items is map of services in homer dashboard
                      items:
                        properties:
                          apiVersion:
                            description: Optional API version used to fetch service
                              data when necessary.
                            type: string
                          apikey:
                            description: Optional API key used to fetch service data
                              when necessary.
                            type: string
                          background:
                            description: Optional color for card to set color directly
                              without custom stylesheet
                            type: string
                          checkInterval:
                            description: Optional check interval in seconds to fetch
                              service data when necessary.
                            type: integer
                          clipboard:
                            description: Text to copy when type is clipboard
                            type: string
                          display:
                            description: Optional - text or bar. Default to text.
                            type: string
                          downloadInterval:
                            description: Optional download interval
                            type: integer
                          endpoint:
                            description: Optional alternative base URL used to fetch
                              service data when necessary.
                            type: string
                          environments:
                            description: Optional environments variables used to fetch
                              service data when necessary.
                            items:
                              type: string
                            type: array
                          icon:
                            description: Icon of service in homer dashboard, See https://fontawesome.com/v5/search
                              for icons options
                            type: string
                          interval:
                            description: Optional interval to fetch service data when
                              necessary.
                            type: integer
                          items:
                            description: Displays Home Assistant instance status,
                              version, location, and entity count
                            items:
                              type: string
                            type: array
                          keywords:
                            description: Keywords of the service in homer dashboard
                            type: string
                          libraryType:
                            description: Optional library type for emby/jellyfin
                            type: string
                          limit:
                            description: Optional limit for number of items to fetch
                              when necessary.
                            type: integer
                          location:
                            description: Optional location for weather
                            type: string
                          locationId:
                            description: Optional location id for weather
                            type: string
                          logo:
                            description: A path to an image can also be provided.
                              Note that icon take precedence if both icon and logo
                              are set.
                            type: string
                          name:
                            description: Name of service in homer dashboard
                            type: string
                          password:
                            description: Optional password used to fetch service data
                              when necessary.
                            type: string
                          query:
                            description: Optional query used to fetch service data
                              when necessary.
                            type: string
                          rateInterval:
                            description: Optional rate interval
                            type: integer
                          separator:
                            description: Optional separator for home assistant
                            type: string
                          slug:
                            description: Optional slug used to fetch service data
                              when necessary.
                            type: string
                          style:
                            description: Optional - either status or counter for miniflux
                            type: string
                          subtitle:
                            description: SubTitle of the service in homer dashboard
                            type: string
                          tag:
                            description: Tag of the service in homer dashboard
                            type: string
                          tagstyle:
                            description: "Tagstyle is the style of the tag in homer
                              dashboard, See https://github.com/bastienwirtz/homer/blob/main/docs/configuration.md#style-options\tfor
                              style options"
                            type: string
                          target:
                            description: Target of the service in homer dashboard
                            type: string
                          token:
                            description: Optional token used to fetch service data
                              when necessary.
                            type: string
                          torrentInterval:
                            description: Optional torrent interval
                            type: integer
                          type:
                            description: Type of the service in homer dashboard
                            type: string
                          units:
                            description: Optional units for weather
                            type: string
                          updateInterval:
                            description: Optional update interval in seconds to fetch
                              service data when necessary.
                            type: integer
                          url:
                            description: Url of the service in homer dashboard
                            type: string
                          username:
                            description: Optional username used to fetch service data
                              when necessary.
                            type: string
                          xmlrpc:
                            description: Optional xmlrpc used to fetch service data
                              when necessary.
                            type: string
                        type: object
                      type: array
                    name:
                      description: Name of group in homer dashboard
                      type: string
                  type: object
                type: array
              linkIcon:
                description: |-
                  LinkIcon is the FontAwesome icon used in the navbar when AutoLink is true.
                  Example: "fas fa-file-alt". See https://fontawesome.com/v5/search for options.
                type: string
              linkName:
                description: |-
                  LinkName is the display name used in the navbar when AutoLink is true.
                  Defaults to the PageName if not set.
                type: string
              pageName:
                description: |-
                  PageName is the name of the page file (without extension).
                  Homer will load this page when the user navigates to "#<pageName>".
                  Example: "page2" will create the file "page2.yml" and be accessible via "#page2".
                pattern: ^[a-z0-9]([a-z0-9\-]*[a-z0-9])?$
                type: string
            required:
            - pageName
            type: object
          status:
            description: HomerPageStatus defines the observed state of HomerPage
            properties:
              ready:
                description: Ready indicates whether the page file has been successfully
                  written.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
