apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "homer-k8s.fullname" . }}
  labels:
    {{- include "homer-k8s.labels" . | nindent 4 }}
data:
  global_config.yml: | 
    {{ include "homer-k8s.calculatedConfig" . | nindent 4 }}
  {{- with .Values.homer.customCss }}
  custom.css: |
    {{- . | nindent 4 }}
  {{- end }}
