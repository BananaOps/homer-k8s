{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "homer-k8s.fullname" . }}
  labels:
    {{- include "homer-k8s.labels" . | nindent 4 }}
rules:
  # Keep in sync with the +kubebuilder:rbac markers of internal/controller
  # CRUD homerservices and homerpages
  - verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    apiGroups:
      - homer.bananaops.io
    resources:
      - homerservices
      - homerpages
  - verbs:
      - get
      - update
      - patch
    apiGroups:
      - homer.bananaops.io
    resources:
      - homerservices/status
      - homerpages/status
  - verbs:
      - update
    apiGroups:
      - homer.bananaops.io
    resources:
      - homerservices/finalizers
      - homerpages/finalizers
{{- end }}
