name: PR Conventional Commit Validation

# pull_request_target (instead of pull_request) so that the GITHUB_TOKEN can
# write labels on Dependabot and fork PRs: on pull_request those PRs only get a
# read-only token and the action fails with "Resource not accessible by
# integration". This is safe because the job never checks out the PR code, it
# only reads the PR title.
on:  # yamllint disable-line rule:truthy
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: PR Conventional Commit Validation
        uses: ytanikin/pr-conventional-commits@1.5.2 # 639145d78959c53c43112365837e3abd21ed67c1
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert"]'
          add_label: true
          add_scope_label: true
