name: Go Test

on:
  pull_request:
    paths:
      - .github/workflows/go-test.yml
      - internal/**
      - cmd/**
      - docs/**
      - generated/**
      - go.mod
      - go.sum
      - main.go

jobs:
  linting:
    name: Go lint
    runs-on: ubuntu-latest
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7.0.1 # 3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Go 1.x
      uses: actions/setup-go@v7.0.0 # b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: stable

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9.3.0 # ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
      with:
        args: --timeout=30m

  security:
    name: Go Security
    runs-on: ubuntu-latest
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7.0.1 # 3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Run Gosec Security Scanner
      uses: securego/gosec@v2.28.0 # 9e75c0576c9878035d4221392108d458abe10fc3
      with:
        args: ./...

  test:
    name: Go test
    runs-on: ubuntu-latest
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7.0.1 # 3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Go 1.x
      uses: actions/setup-go@v7.0.0 # b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: stable

    - name: Install
      run: go mod download -x

    - name: Test
      run: go test -v ./...
