# Dependabot PR titles must pass the "PR Conventional Commit Validation"
# workflow and be picked up by release-please:
#   - Go modules     -> "fix(deps): ..." : releasable, triggers a patch release
#   - GitHub Actions -> "ci(deps): ..."  : listed in the changelog, no release on its own
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix"
      include: "scope"
    groups:
      # k8s.io/* and controller-runtime must move together: bumping client-go
      # alone breaks the build (see #176).
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      aws-sdk:
        patterns:
          - "github.com/aws/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
